name: daily-news
on:
  schedule:
    - cron: '50 22 * * *'      # 06:50 北京时间
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch news
        run: python3 scripts/fetch_news.py
      - name: Show result
        run: head -c 600 news.json
      - name: Commit
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore(news): 每日时政 $(date -u +%Y-%m-%d)"
            git push
          fi
