<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f1e8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="上岸工作台">
<title>上岸工作台 · 备考兔</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B0%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<style>
/* ===== 设计令牌 · 奶油米色治愈系 ===== */
:root{
  --cream:#f8f1e8;
  --card:#fffdf9;
  --card2:#fff7ec;
  --ink:#4b4038;
  --ink2:#8b7b6c;
  --ink3:#a8968a;
  --line:#efe2d2;
  --blue:#8ec9ef;
  --blue-d:#5b9fd0;
  --blue-l:#eaf4fb;
  --mint:#a8e6cf;
  --mint-d:#63c09a;
  --butter:#ffe8a3;
  --butter-l:#fff7de;
  --coral:#ff9d8f;
  --coral-d:#ef7d6c;
  --coral-l:#ffe8e3;
  --r-lg:26px;
  --r-md:20px;
  --r-sm:14px;
  --nav-w:230px;
  --fs-h1:24px;
  --fs-card:17px;
  --fs-body:15px;
  --fs-btn:13.5px;
  --fs-num:56px;
  --fs-sm:12.5px;
  --shadow:0 8px 24px rgba(174,144,116,.10);
  --shadow-sm:0 3px 10px rgba(174,144,116,.08);
  --grad:linear-gradient(135deg,#8ec9ef 0%,#a8e6cf 100%);
  --grad-strong:linear-gradient(135deg,#7cbde9 0%,#8fdcbe 100%);
  --grad-warm:linear-gradient(135deg,#ffb3a4 0%,#ff9d8f 100%);
}
body[data-font="s"]{--fs-h1:20px;--fs-card:15px;--fs-body:13px;--fs-btn:12.5px;--fs-num:42px;--fs-sm:11.5px}
body[data-font="l"]{--fs-h1:28px;--fs-card:19px;--fs-body:16px;--fs-btn:15.5px;--fs-num:64px;--fs-sm:14px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink);
  font-size:var(--fs-body);
  line-height:1.62;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{max-width:100%;display:block}
button{font-family:inherit;font-size:var(--fs-btn);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:var(--fs-body);color:var(--ink)}
a{color:var(--blue-d);text-decoration:none}

/* ===== 侧边栏 ===== */
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);
  background:linear-gradient(180deg,#eff8fd 0%,#e8f2fa 60%,#eaf5f0 100%);
  border-right:1px solid #ddebf6;
  border-radius:0 28px 28px 0;
  display:flex;flex-direction:column;
  z-index:60;
  transition:transform .28s cubic-bezier(.22,.61,.36,1);
  box-shadow:6px 0 26px rgba(150,175,195,.10);
}
#sidebar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#a9d7f4,#8ec9ef 45%,#a8e6cf);border-radius:0 6px 6px 0}
body.nav-collapsed #sidebar{transform:translateX(-105%)}
.nav-head{padding:18px 12px 12px 16px;position:relative}
.pin-btn{
  position:absolute;right:8px;top:12px;width:30px;height:30px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:14px;
  border:1px solid #e6eef5;
}
.pin-btn.on{background:#e8f4ff;border-color:#b8dcf5}
.avatar-wrap{
  width:54px;height:54px;border-radius:50%;overflow:hidden;position:relative;cursor:pointer;
  background:#fff;border:2.5px solid #fff;box-shadow:0 4px 12px rgba(120,150,175,.18);
  display:grid;place-items:center;font-size:26px;
}
.avatar-wrap img{width:100%;height:100%;object-fit:cover}
.avatar-wrap .cam{
  position:absolute;inset:0;background:rgba(75,64,56,.42);color:#fff;display:grid;place-items:center;
  font-size:16px;opacity:0;transition:opacity .18s;
}
.avatar-wrap:hover .cam{opacity:1}
.nav-nick{
  display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:var(--fs-card);
  font-weight:700;cursor:pointer;max-width:100%;
}
.nav-nick .pencil{font-size:11px;opacity:0;transition:opacity .18s}
.nav-nick:hover .pencil{opacity:1}
.nav-motto{
  font-size:var(--fs-sm);color:var(--ink2);line-height:1.45;margin-top:3px;cursor:pointer;
  padding-right:4px;word-break:break-all;
}
.nav-motto:hover{color:var(--blue-d)}

.nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px 12px;scrollbar-width:thin}
.nav-scroll::-webkit-scrollbar{width:4px}
.nav-scroll::-webkit-scrollbar-thumb{background:#cfe3f2;border-radius:4px}
.nav-group{margin-bottom:12px}
.nav-group-t{font-size:var(--fs-sm);color:var(--ink3);padding:6px 8px 4px 10px;letter-spacing:.08em;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:16px;
  color:var(--ink);cursor:pointer;margin-bottom:3px;position:relative;
  font-size:var(--fs-body);line-height:1.35;
  transition:background .16s,color .16s,transform .16s;
}
.nav-item .ico{font-size:calc(var(--fs-body) + 2px);flex:0 0 auto;width:1.2em;text-align:center}
.nav-item .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.72)}
.nav-item.active{
  background:var(--grad);color:#fff;font-weight:700;
  box-shadow:0 5px 14px rgba(120,190,200,.32);
}
.nav-item.active::before{
  content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);
  width:4px;height:20px;border-radius:0 4px 4px 0;background:#3f93cf;
}
.nav-foot{padding:8px 12px 14px;border-top:1px solid #e0ecf6}
.sync-pill{
  display:flex;align-items:center;gap:5px;font-size:calc(var(--fs-sm) - 2px);
  padding:6px 8px;border-radius:999px;background:#fff;color:var(--ink2);
  border:1px solid #e3edf5;margin-bottom:7px;line-height:1.3;white-space:nowrap;overflow:hidden;
}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:#c9c1b8;flex:0 0 auto}
.sync-pill.online .dot{background:var(--mint-d);box-shadow:0 0 0 3px rgba(99,192,154,.18)}
.sync-pill.local .dot{background:#e8b96a}
.set-btn{
  width:100%;display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:14px;
  background:rgba(255,255,255,.78);color:var(--ink);border:1px solid #e3edf5;font-size:var(--fs-body);
}
.set-btn:hover{background:#fff}

/* 折叠态浮球 + 左边缘竖条 */
#navFab{
  position:fixed;left:14px;bottom:22px;width:48px;height:48px;border-radius:50%;
  background:var(--grad-strong);color:#fff;font-size:20px;display:none;place-items:center;
  box-shadow:0 8px 20px rgba(110,180,190,.42);z-index:58;
}
body.nav-collapsed #navFab{display:grid}
#navTab{
  position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:57;
  width:16px;height:76px;border-radius:0 10px 10px 0;background:#cfe6f7;
  display:none;place-items:center;color:#5b9fd0;font-size:9px;writing-mode:vertical-rl;
  letter-spacing:.1em;box-shadow:2px 0 8px rgba(120,160,190,.18);
}
body.nav-collapsed #navTab{display:grid}

/* ===== 主内容 ===== */
#main{
  margin-left:var(--nav-w);
  padding:20px 22px 60px;
  transition:margin-left .28s cubic-bezier(.22,.61,.36,1);
  min-height:100vh;
}
body.nav-collapsed #main{margin-left:0}
body.nav-collapsed .wrap{margin:0 auto}
.wrap{max-width:940px;margin:0 auto}
.page{display:none;animation:fade .26s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:center;gap:9px;margin:2px 0 14px;flex-wrap:wrap}
.page-head h1{font-size:var(--fs-h1);margin:0;font-weight:800;letter-spacing:.01em}
.page-head .sub{font-size:var(--fs-sm);color:var(--ink2);margin-left:auto}

/* 卡片 */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px;
}
.card.tight{padding:16px 18px}
.card.butter{background:linear-gradient(135deg,#fffaf0,#fff3d4);border-color:#f6e6ba}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{font-size:var(--fs-card);margin:0;font-weight:800}
.card-head .tag{
  font-size:calc(var(--fs-sm) - 1px);padding:3px 9px;border-radius:999px;
  background:var(--blue-l);color:#3d87b8;font-weight:600;
}
.card-head .tag.mint{background:#e8f8f1;color:#3f9b78}
.card-head .tag.warm{background:var(--butter-l);color:#a8811f}
.card-head .tag.coral{background:var(--coral-l);color:#c9604f}
.card-head .right{margin-left:auto;display:flex;gap:7px;align-items:center}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);
  color:var(--ink);font-size:var(--fs-btn);font-weight:600;line-height:1.2;
  transition:transform .12s,box-shadow .16s,background .16s;
}
.btn:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:var(--grad-strong);color:#fff;border:none;box-shadow:0 5px 14px rgba(120,190,190,.32)}
.btn.ghost{background:#fff;color:var(--ink2)}
.btn.coral{background:var(--coral-l);color:#c9604f;border-color:#fbd6ce}
.btn.sm{padding:5px 12px;font-size:calc(var(--fs-btn) - 1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.icon-btn{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink2);
}
.icon-btn:hover{background:var(--blue-l);color:var(--blue-d)}

/* 进度条 */
.bar{height:10px;border-radius:999px;background:#f1e7da;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--grad);transition:width .5s ease}
.bar.thin{height:7px}
.bar.lg{height:14px}
.pct{font-size:calc(var(--fs-sm) + 1px);font-weight:800;color:var(--blue-d)}

/* 倒计时 */
.cd-card{
  background:var(--grad-strong);color:#fff;border-radius:28px;padding:26px 26px 22px;
  box-shadow:0 12px 30px rgba(110,180,190,.28);position:relative;overflow:hidden;
}
.cd-card.warn{background:var(--grad-warm);box-shadow:0 12px 30px rgba(239,125,108,.28)}
.cd-card::after{
  content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.14);
}
.cd-label{font-size:var(--fs-sm);opacity:.95;display:flex;align-items:center;gap:6px}
.cd-num{font-size:var(--fs-num);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.cd-num small{font-size:calc(var(--fs-num) * .3);font-weight:700;margin-left:4px}
.cd-exam{font-size:var(--fs-card);font-weight:700}
.cd-pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.cd-pill{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:999px;font-size:var(--fs-sm)}
.cd-actions{position:absolute;right:16px;bottom:16px;display:flex;gap:6px}
.cd-actions .icon-btn{background:rgba(255,255,255,.9);border:none}

/* 引语 */
.quote{font-size:var(--fs-body);line-height:1.8;color:#6f5c48}
.quote .src{display:block;margin-top:6px;font-size:var(--fs-sm);color:#a8811f}

/* 列表行 */
.row{
  display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:var(--r-sm);
  background:var(--card2);margin-bottom:8px;border:1px solid #f6ecdd;
}
.row.done{opacity:.62}
.row.overdue{background:#fff2ef;border-color:#fbd9d2}
.row .chk{
  width:22px;height:22px;border-radius:8px;border:2px solid #d9cabb;background:#fff;
  display:grid;place-items:center;flex:0 0 auto;margin-top:1px;font-size:12px;color:#fff;
}
.row .chk.on{background:var(--mint-d);border-color:var(--mint-d)}
.row .txt{flex:1;min-width:0;word-break:break-word}
.row .txt .m{font-size:calc(var(--fs-sm) - 1px);color:var(--ink3);margin-top:2px}
.row .del{opacity:.4;font-size:13px;padding:2px 4px}
.row .del:hover{opacity:1;color:var(--coral-d)}

/* 徽标 */
.cat-pill{font-size:calc(var(--fs-sm) - 2px);padding:2px 8px;border-radius:999px;background:#eef6fc;color:#4a8dba;font-weight:600;white-space:nowrap}
.cat-pill.申论{background:#fdf0e4;color:#b4803f}
.cat-pill.常识{background:#f0f5e6;color:#7a9440}
.dot-sep{color:#cbbdaf;padding:0 2px}
.muted{color:var(--ink2)}
.tiny{font-size:var(--fs-sm)}
.mini{font-size:calc(var(--fs-sm) - 1.5px);color:var(--ink3)}

/* 网格 */
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.grid.c3,.grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}}

/* 内容条目 */
.item{
  padding:13px 15px;border-radius:var(--r-md);background:var(--card2);
  border:1px solid #f6ecdd;margin-bottom:10px;
}
.item h3{margin:0 0 5px;font-size:calc(var(--fs-body) + .5px);font-weight:700;line-height:1.5}
.item p{margin:5px 0}
.item .kp{color:#a8811f;background:var(--butter-l);padding:5px 9px;border-radius:10px;display:inline-block;font-size:calc(var(--fs-sm) + .5px);line-height:1.5}
.item .src-link{font-size:var(--fs-sm);color:var(--blue-d);display:inline-flex;gap:4px;align-items:center;word-break:break-all}
.opt{
  display:block;padding:9px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);
  margin-bottom:7px;cursor:pointer;font-size:var(--fs-body);transition:background .15s,border-color .15s;
}
.opt:hover{background:var(--blue-l)}
.opt.right{background:#e9f9f1;border-color:#a8e6cf}
.opt.wrong{background:#fff0ec;border-color:#f9c9c0}
.explain{background:#f7f4ee;border-radius:14px;padding:11px 13px;font-size:calc(var(--fs-sm) + .5px);color:#6f6156;line-height:1.7;margin-top:6px}

/* 表单 */
.field{margin-bottom:10px}
.field label{display:block;font-size:var(--fs-sm);color:var(--ink2);margin-bottom:4px;font-weight:600}
.inp,textarea.inp,select.inp{
  width:100%;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:#fff;
  outline:none;transition:border-color .16s,box-shadow .16s;
}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(142,201,239,.22)}
textarea.inp{min-height:72px;resize:vertical;line-height:1.6}
.inp-row{display:flex;gap:8px;flex-wrap:wrap}
.inp-row > *{flex:1;min-width:120px}

/* 模态 */
#modal{
  position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:16px;
  background:rgba(75,64,56,.30);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
#modal.show{display:grid}
.modal-box{
  background:var(--card);border-radius:28px;padding:22px;width:100%;max-width:440px;
  max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(90,70,50,.24);
  animation:pop .22s ease;
}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.modal-box h3{margin:0 0 4px;font-size:var(--fs-card);font-weight:800}
.modal-box .desc{font-size:var(--fs-sm);color:var(--ink2);margin-bottom:14px;line-height:1.6}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* toast */
#toast{
  position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);z-index:300;
  background:rgba(75,64,56,.92);color:#fff;padding:9px 18px;border-radius:999px;
  font-size:var(--fs-btn);opacity:0;pointer-events:none;transition:.24s;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 统计条 */
.stat{background:var(--card2);border-radius:var(--r-md);padding:12px 14px;border:1px solid #f6ecdd}
.stat .k{font-size:var(--fs-sm);color:var(--ink2)}
.stat .v{font-size:calc(var(--fs-h1) * .86);font-weight:800;color:var(--ink);line-height:1.25;font-variant-numeric:tabular-nums}
.stat .v small{font-size:var(--fs-sm);font-weight:600;color:var(--ink2);margin-left:2px}

/* 迷你柱状图 */
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars .col i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--grad);min-height:3px;transition:height .5s}
.bars .col span{font-size:calc(var(--fs-sm) - 2px);color:var(--ink3)}

/* 空态 */
.empty{text-align:center;color:var(--ink3);font-size:var(--fs-sm);padding:22px 10px;line-height:1.8}
.empty .big{font-size:30px;display:block;margin-bottom:6px}

/* 错题卡 */
.wrong-card{background:var(--card2);border:1px solid #f6ecdd;border-radius:var(--r-md);padding:14px;margin-bottom:10px}
.wrong-card.mastered{opacity:.55}
.wrong-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wrong-imgs img{width:78px;height:78px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}

/* 折叠面板 */
.acc{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:10px;background:#fff}
.acc-h{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;font-weight:700;font-size:var(--fs-body);background:var(--card2)}
.acc-h .arrow{margin-left:auto;transition:transform .2s;color:var(--ink3);font-size:12px}
.acc.open .acc-h .arrow{transform:rotate(90deg)}
.acc-b{display:none;padding:13px 15px;font-size:calc(var(--fs-body) - .5px);line-height:1.75}
.acc.open .acc-b{display:block}

/* 移动端 */
@media(max-width:1024px){:root{--nav-w:170px}}
@media(max-width:640px){
  :root{--nav-w:140px}
  #main{padding:14px 10px 70px}
  .card{padding:16px 13px;border-radius:22px}
  .cd-card{padding:20px 16px 18px;border-radius:24px}
  .nav-head{padding:14px 8px 8px 12px}
  .avatar-wrap{width:40px;height:40px;font-size:19px;border-width:2px}
  .pin-btn{width:26px;height:26px;font-size:12px;right:6px;top:9px}
  .nav-nick{margin-top:6px;gap:3px}
  .nav-nick .pencil{opacity:.55}
  .nav-motto{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:calc(var(--fs-sm) - 1px)}
  .nav-scroll{padding-left:7px;padding-right:5px}
  .nav-group-t{padding-left:6px;font-size:calc(var(--fs-sm) - 2px)}
  .sync-pill{font-size:calc(var(--fs-sm) - 3px);padding:5px 6px;gap:4px}

  {a:'不负众望', b:'不孚众望', mean:'不负众望：没有辜负大家的期望（褒义）。不孚众望：不能使众人信服（孚＝使人信服，贬义）。', dist:'一字之差，感情色彩完全相反。', ex:'他带伤出战夺得金牌，不负众望。／这位候选人能力平平，不孚众望。',
   q:{stem:'下列句子中成语使用恰当的一项是：', opts:['新教练上任后球队成绩不升反降，实在不孚众望。','他多年扎根乡村教育，被评为一等功，真是不孚众望。','这部续集票房大卖，被观众评价为不孚众望。','他一再失言，却依然不负众望地当选。'], ans:0, exp:'B、C、D 都把"不孚众望"当成了褒义"不负众望"。A 项成绩下降、不能让人信服，用"不孚众望"正确。'}},
  {a:'无可厚非', b:'无可非议', mean:'无可厚非：虽有缺点，但可以理解，不能过分责备。无可非议：完全正确，没有什么可以指责的。', dist:'前者默认"有瑕疵但可谅解"，后者是"挑不出毛病"。', ex:'年轻人追求个性表达，行为并无违法，无可厚非。／他依法依规办事，无可非议。',

  {a:'不以为然', b:'不以为意', mean:'不以为然：不认为是对的，表示不同意。不以为意：不把它放在心上，表示不重视。', dist:'"然"＝对、正确；"意"＝心意、心上。', ex:'对"多刷题就够了"的说法，我不以为然。／家长多次提醒安全，他却不以为意。',
   q:{stem:'下列句子成语使用不恰当的一项是：', opts:['对"背模板就能得高分"的观点，阅卷老师都不以为然。','汛期将至，个别村民对警示牌不以为意，仍在河道内捕鱼。','他对同事的劝告不以为然，依旧我行我素。','面对台风预警，他毫不在意，还说"不以为然，无需转移"。'], ans:3, exp:'D 项把"不以为意"（不放在心上）误用为"不以为然"，且句子本身自相矛盾。A、B、C 均正确。'}},
  {a:'无所不为', b:'无所不至', mean:'无所不为：什么坏事都干得出来（贬）。无所不至：①什么坏事都做 ②关怀照顾周到细致到极点。', dist:'"无所不至"可表"细致周到"，"无所不为"只能指坏事。', ex:'这伙人横行乡里，无所不为。／母亲对孩子的照顾无所不至。',
   q:{stem:'下列各句中，"无所不至"使用恰当的一项是：', opts:['这伙歹徒烧杀抢掠，无所不至。','父母对子女的关心无所不至，令人动容。','他学习认真，把课本翻得无所不至。','公司服务客户无所不至，遭到投诉。'], ans:1, exp:'"无所不至"表关怀周到细致用在本项恰当。A 项与"烧杀抢掠"搭配虽可指坏事，但不如"无所不为"更贴；C、D 属搭配不当与语义矛盾（服务周到却遭投诉）。'}},
  {a:'耳濡目染', b:'耳提面命', mean:'耳濡目染：经常听到看到，不知不觉受到影响。耳提面命：当面恳切地教导（多用于长辈对晚辈）。', dist:'前者强调"潜移默化"，后者强调"当面教导"。', ex:'在书香门第长大，他耳濡目染，也爱上了读书。／导师耳提面命，让他改掉了浮躁的毛病。',
   q:{stem:'填入最恰当的一项：从小在剧团后台长大，她____，十几岁就能登台唱全本。', opts:['耳提面命','耳濡目染','言传身教','亦步亦趋'], ans:1, exp:'后台长大、不知不觉受影响，用"耳濡目染"；"耳提面命"要求有人当面教导；"言传身教"需有行为示范者；"亦步亦趋"含贬义。'}},
  {a:'鱼龙混杂', b:'鱼目混珠', mean:'鱼龙混杂：坏人和好人混在一起／好的坏的混在一起。鱼目混珠：拿鱼眼珠冒充珍珠，比喻以假乱真。', dist:'前者侧重"成分混杂"，后者侧重"假冒充真"。', ex:'二手车市场鱼龙混杂，购车需谨慎。／有些培训机构鱼目混珠，用假证书欺骗学员。',
   q:{stem:'下列句子中成语使用恰当的一项是：', opts:['直播带货行业鱼龙混杂，消费者需擦亮眼睛。','他把国产零件鱼龙混杂地装进设备，冒充进口。','这些假冒名牌鱼龙混杂，严重侵害消费者权益。','队伍里鱼目混珠，既有专家也有新手。'], ans:0, exp:'A 项行业良莠不齐，用"鱼龙混杂"恰当。B、C 是"假冒充真"应为"鱼目混珠"；D 是人员构成混杂，用"鱼龙混杂"（指人时多含好坏混杂义）不确，本题取 A。'}},
  {a:'惨淡经营', b:'苦心孤诣', mean:'惨淡经营：费尽心力经营（多用于事业、企业，中性偏褒）。苦心孤诣：费尽心思钻研，达到别人达不到的境地。', dist:'前者对象是"事业/生意"，后者对象是"学问/技艺"。', ex:'这家书店惨淡经营二十年，终于成了城市文化地标。／他苦心孤诣研究甲骨文四十年。',

  {a:'屡试不爽', b:'屡试不第', mean:'屡试不爽：多次试验都没有差错（爽＝差错）。屡试不第：多次考试都没有考中（第＝及第）。', dist:'"不爽"不是"不高兴"，"不第"不是"不第一"。', ex:'这个记忆方法我用过多次，屡试不爽。／他科考屡试不第，转而著书立说。',

  {a:'差强人意', b:'不尽如人意', mean:'差强人意：大体上还能使人满意（"差"＝稍微，是肯定评价）。不尽如人意：不能完全让人满意（否定评价）。', dist:'这是公考高频"望文生义"陷阱，二者感情色彩相反。', ex:'这部影片虽有瑕疵，但整体差强人意。／这次服务体验不尽如人意。',
   q:{stem:'下列句子成语使用恰当的一项是：', opts:['新系统上线后故障频发，用户体验差强人意。','首场比赛虽有小失误，整体表现差强人意。','他的答复含糊其辞，令领导差强人意。','面对差强人意的成绩，他决定放弃考试。'], ans:1, exp:'"差强人意"是"大体让人满意"，B 正确。A、D 明显是否定语境，应用"不尽如人意"；C 搭配不当。'}},
  {a:'耸人听闻', b:'骇人听闻', mean:'耸人听闻：故意夸大或捏造事实，使人听后震惊（主观造势）。骇人听闻：客观事实令人非常吃惊（真实发生的坏事）。', dist:'前者"假/夸大"，后者"真且极坏"。', ex:'自媒体为流量制造耸人听闻的标题。／这起案件手段残忍，骇人听闻。',
   q:{stem:'填入最恰当的一项：个别账号为博眼球，编造____的"内幕消息"。', opts:['骇人听闻','耸人听闻','危言耸听','匪夷所思'], ans:1, exp:'"编造"说明消息虚假、故意夸大，用"耸人听闻"；"骇人听闻"须是真实发生的恶行；"危言耸听"强调故意说吓人的话，可作干扰但搭配"内幕消息"不如前者贴切。'}},
  {a:'首当其冲', b:'一马当先', mean:'首当其冲：最先受到攻击或遭遇灾难（"冲"＝要冲，不是"冲在前面"）。一马当先：作战或做事冲在最前面。', dist:'公考最经典误用：把"首当其冲"当"带头"。', ex:'暴雨来袭，低洼片区首当其冲。／在技术攻关中，他始终一马当先。',
   q:{stem:'下列句子成语使用恰当的一项是：', opts:['在抗洪抢险中，他首当其冲，第一个跳进激流。','产业转型中，传统加工企业首当其冲面临成本压力。','面对难题，青年党员首当其冲，带头攻关。','他首当其冲地完成了全年任务。'], ans:1, exp:'"首当其冲"＝最先受到冲击，B 正确。A、C、D 都误当作"冲在最前面"，应为"一马当先"。'}},
  {a:'不胫而走', b:'不翼而飞', mean:'不胫而走：没有腿却能跑，形容消息等传播迅速。不翼而飞：没有翅膀却飞走了，形容东西突然丢失，也指消息传得快。', dist:'"东西丢了"只能用"不翼而飞"。', ex:'招聘结果还未公布，消息已经不胫而走。／办公室的手表不翼而飞。',
   q:{stem:'下列句子成语使用恰当的一项是：', opts:['他把车停在路边，回来发现车里的包不胫而走。','演出取消的消息不胫而走，观众很快散去。','这笔资金不胫而走，账目出现巨大缺口。','文件放在桌上，一转身就不胫而走。'], ans:1, exp:'消息传播快用"不胫而走"，B 正确；A、C、D 均指物品丢失，应为"不翼而飞"。'}},
  {a:'处心积虑', b:'殚精竭虑', mean:'处心积虑：长期谋划，多含贬义。殚精竭虑：用尽精力、费尽心思，褒义。', dist:'感情色彩相反，是申论与言语题的常见设错点。', ex:'他处心积虑地排挤同事，最终被查处。／为攻克难题，团队殚精竭虑。',
   q:{stem:'填入最恰当的一项：为让搬迁群众稳得住、能致富，社区干部____。', opts:['处心积虑','殚精竭虑','费尽心机','挖空心思'], ans:1, exp:'语境是正面赞扬，用"殚精竭虑"；其余三项均含贬义。'}},
  {a:'目无全牛', b:'目中无人', mean:'目无全牛：技艺极其纯熟，达到得心应手的境界（褒）。目中无人：骄傲自大，看不起人（贬）。', dist:'"全牛"是"完整的牛"，指技术精湛。', ex:'这位老师傅解剖手法目无全牛。／他刚有点成绩就目中无人。',

  {a:'望其项背', b:'望尘莫及', mean:'望其项背：能够赶得上（多用于否定式"难以望其项背"）。望尘莫及：远远落后，赶不上。', dist:'"望其项背"本身是"赶得上"，前面加否定才表示赶不上。', ex:'他的棋力之高，同龄人难以望其项背。／对手实力强劲，我们望尘莫及。',

  {type:'真假推理', stem:'甲、乙、丙三人中只有一人说真话。甲说"我没偷"，乙说"丙偷了"，丙说"我没偷"。谁偷了东西？', opts:['甲','乙','丙','无法确定'], ans:0, exp:'乙与丙的话矛盾，必有一真一假，故甲说的是假话，即甲偷了。此时乙假丙真，符合"只有一人说真话"。'},
  {type:'加强论证', stem:'研究发现，每天步行超过8000步的人，心血管疾病发病率明显低于步行不足4000步的人。因此研究者认为，多步行能降低心血管疾病风险。以下哪项最能加强该结论？', opts:['步行时心率上升，可改善血管弹性','该研究样本量较大且随访超过五年','步行多的人往往也更注意饮食','部分步行多的人仍然患了心血管疾病'], ans:0, exp:'A 项补充了"步行→血管弹性改善→降低风险"的机制，属于解释型加强，力度最强。B 是样本加强但不如机制；C 另有他因削弱；D 削弱。'},
  {type:'削弱论证', stem:'某市推行"垃圾分类积分换礼品"后，参与率大幅提升。有人据此认为该政策有效提升了居民环保意识。以下哪项最能削弱？', opts:['参与率提升主要因为礼品吸引力，居民并不了解分类标准','该市垃圾分类收运体系尚不完善','部分小区积分兑换点距离较远','其他城市也推行了类似政策'], ans:0, exp:'A 直接指出参与行为由利益驱动而非意识提升，切断了"参与率→环保意识"的因果链。B、C 是执行问题；D 与他市无关。'},
  {type:'前提假设', stem:'要让"取消纸质发票、全面推行电子发票能显著降低企业运营成本"这一结论成立，必须假设：', opts:['企业具备使用和存储电子发票的信息化条件','电子发票的法律效力得到认可','纸质发票的印制成本占企业成本的主要部分','大部分企业愿意接受电子发票'], ans:0, exp:'若企业没有信息化条件，推行电子发票反而增加成本，结论不成立，故 A 是必要前提。B、C、D 虽相关但非必须。'},
  {type:'类比推理', stem:'医生∶手术刀 相当于', opts:['画家∶颜料','农民∶锄头','教师∶黑板','司机∶乘客'], ans:1, exp:'医生使用手术刀作为工具，农民使用锄头作为工具，均为"职业—专用工具"关系。画家用画笔（颜料是材料）、教师用粉笔、司机载乘客。'},
  {type:'分析推理', stem:'甲、乙、丙分别来自北京、上海、广州。已知：①甲不来自北京；②乙不来自上海；③来自广州的人年龄最小。若乙是三人中年龄最大的，则甲来自：', opts:['北京','上海','广州','无法确定'], ans:1, exp:'乙最大，故乙不来自广州；又乙不来自上海，则乙来自北京。甲不来自北京，也不来自广州（广州者年龄最小），故甲来自上海。'}

function daysTo(s){ return Math.ceil((parseDate(s).getTime() - parseDate(todayStr()).getTime()) / 86400000); }
function fmtCN(s){ var p = String(s||'').split('-'); return p.length === 3 ? (p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日') : s; }
function weekdayCN(d){ return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]; }

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function deepMerge(base, patch){
  if(!patch || typeof patch !== 'object' || Array.isArray(patch)) return base;
  Object.keys(patch).forEach(function(k){
    var v = patch[k];
    if(v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])){
      base[k] = deepMerge(base[k], v);
    } else if(v !== undefined){ base[k] = v; }
  });
  return base;
}

var saveTimer = null, saveWarned = false, snapDone = '';

/* ---------- IndexedDB 备份库（抗 localStorage 被清/损坏） ---------- */
var IDB_NAME = 'shangan_backup_v1';
function idbOpen(){
  return new Promise(function(res, rej){
    if(!window.indexedDB) return rej(new Error('no idb'));
    var req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){ var db = req.result; if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error); };
  });
}
function idbPut(k, v){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = function(){ res(true); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}
function idbGet(k){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction('kv', 'readonly');
      var rq = tx.objectStore('kv').get(k);
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
    });
  });
}
function idbDel(k){
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').delete(k);
      tx.oncomplete = function(){ res(true); };
      tx.onerror = function(){ res(false); };
    });
  });
}

function idbClearAll(){
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').clear();
      tx.oncomplete = function(){ res(true); };
      tx.onerror = function(){ res(false); };
    });
  }).catch(function(){ return false; });
}

/* 写盘：localStorage（快）+ IndexedDB（稳）+ 每日快照 + 自动云同步 */
function persist(){
  state.updatedAt = Date.now();
  var json;
  try{ json = JSON.stringify(state); }catch(e){ return; }
  try{ localStorage.setItem(LS_KEY, json); }
  catch(e){
    if(!saveWarned){ saveWarned = true; toast('⚠️ 浏览器存储空间不足，先删几张错题图片'); }
  }
  try{ idbPut('state', { ts:Date.now(), json:json }).catch(function(){}); }catch(e){}
  try{ snapshotDaily(json); }catch(e){}
  try{
    if(state.settings.sync && state.settings.sync.auto && state.settings.sync.url) scheduleAutoSync();
  }catch(e){}
  try{
    var gh0 = state.settings.gh || {};
    if(gh0.auto && gh0.token && gh0.gistId) ghSchedulePush();
  }catch(e){}
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 180);
}
function saveNow(){
  clearTimeout(saveTimer);
  persist();
}
/* 每天留一份快照，滚动保留 10 份 */
function snapshotDaily(json){
  var d = todayStr();
  if(snapDone === d) return;
  snapDone = d;
  idbGet('snapindex').then(function(list){
    list = list || [];
    if(list.indexOf(d) === -1) list.push(d);

function compressImage(file, maxW, quality, cb){
  try{
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = function(){ cb(reader.result); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }catch(e){ toast('图片处理失败'); }
}

/* ================= 每日计划 · 数据层 ================= */
function ensureToday(){
  var t = todayStr();
  if(!state.plans[t]) state.plans[t] = [];
  var list = state.plans[t];
  (state.templates || []).forEach(function(tpl){
    var exists = list.some(function(x){ return x.tplId === tpl.id; });
    if(!exists) list.push({ id:uid(), tplId:tpl.id, text:tpl.text, cat:tpl.cat, done:false, repeat:true });
  });
  return list;
}
function plansOf(day){ return state.plans[day] || []; }
function addPlan(text, cat, repeat){
  var t = todayStr();
  var list = ensureToday();
  list.push({ id:uid(), text:text, cat:cat, done:false, repeat:!!repeat, tplId: repeat ? uid() : null });
  if(repeat){ state.templates.push({ id:list[list.length-1].tplId, text:text, cat:cat }); }
  save(); return list[list.length-1];
}
function togglePlan(id){
  var list = ensureToday();
  var it = list.filter(function(x){ return x.id === id; })[0];
  if(it){ it.done = !it.done; it.doneAt = it.done ? new Date().toISOString() : null; save(); }
  return it;
}
function delPlan(id){
  var list = ensureToday();
  var idx = list.findIndex(function(x){ return x.id === id; });
  if(idx >= 0){ var it = list[idx]; if(it.tplId) state.templates = state.templates.filter(function(tp){ return tp.id !== it.tplId; }); list.splice(idx, 1); save(); }
}
function delTemplate(id){ state.templates = state.templates.filter(function(t){ return t.id !== id; }); }

/* 逾期：今天之前未完成 */
function overduePlans(){
  var t = todayStr(), out = [];
  Object.keys(state.plans).forEach(function(day){
    if(day >= t) return;
    (state.plans[day] || []).forEach(function(it){ if(!it.done) out.push({ day:day, item:it }); });
  });
  out.sort(function(a, b){ return a.day < b.day ? -1 : 1; });
  return out.slice(0, 20);
}
function doneRate(day){
  var list = plansOf(day).filter(function(x){ return !x.tplId || true; });
  if(!list.length) return null;
  var d = list.filter(function(x){ return x.done; }).length;
  return d / list.length;
}

function statOf(day, cat){
  var s = state.stats[day] || {};
  if(!s[cat]) s[cat] = { count:0, min:0, right:0 };
  state.stats[day] = s;
  return s[cat];
}
function getStat(day, cat){ var s = state.stats[day] || {}; return s[cat] || { count:0, min:0, right:0 }; }
function logAnswer(cat, correct){
  var c = statOf(todayStr(), cat);
  c.count = (c.count || 0) + 1;
  if(correct) c.right = (c.right || 0) + 1;
  save();
}
function totalOf(day){
  var s = state.stats[day] || {}, o = { count:0, min:0, right:0 };
  Object.keys(s).forEach(function(k){ o.count += s[k].count || 0; o.min += s[k].min || 0; o.right += s[k].right || 0; });
  return o;
}

function parseSkillFile(name, text){
  var desc = '', title = name.replace(/\.(md|markdown|txt)$/i, '');
  var m = text.match(/^---\r?\n([\s\S]{0,4000}?)\r?\n---/);
  var fm = m ? m[1] : '';
  var dm = fm.match(/description:\s*(\|[\s\S]*?)(?=\w+:|$)/);
  if(dm){
    desc = dm[1].split('\n').map(function(s){ return s.trim(); }).filter(Boolean).join(' ')
             .replace(/^\|\s*/, '').replace(/\s+/g, ' ').slice(0, 260);
  }
  if(!desc){
    var h = text.match(/^#\s+(.+)$/m);
    if(h) desc = h[1].slice(0, 120);
  }
  return { name: title, desc: desc, mod: skillModOf(title + ' ' + desc) };
}
function importSkillFiles(files){
  var arr = Array.prototype.slice.call(files || []);
  if(!arr.length) return;
  var done = 0, added = 0;
  arr.forEach(function(f){
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var text = String(fr.result || '');
        var meta = parseSkillFile(f.name, text);
        var id = 'sk_' + f.name.replace(/[^\w\u4e00-\u9fa5]+/g, '_').slice(0, 40) + '_' + f.size;
        idbPut('skill:' + id, { id:id, name:meta.name, mod:meta.mod, desc:meta.desc, size:f.size, text:text }).then(function(){
          return idbGet('skillindex');
        }).then(function(list){
          list = list || [];
          if(!list.filter(function(x){ return x.id === id; }).length){
            list.push({ id:id, name:meta.name, mod:meta.mod, desc:meta.desc, size:f.size });
            added++;
          }
          return idbPut('skillindex', list);
        }).catch(function(){}).finally(function(){
          done++;
          if(done === arr.length){
            teacherCache = null;
            renderTeacherList();
            toast('导入完成：' + (added || arr.length) + ' 个文件');
          }
        });
      }catch(e){ done++; }
    };
    fr.onerror = function(){ done++; };
    fr.readAsText(f);
  });
}

var AI_SYS = '你是一位带过十届国省考的公考老师，讲题风格固定：先一句话判断"这题考什么"，再给 2-4 步可执行步骤，最后给一句口诀或易错提醒。中文回答，简洁，控制在 300 字内。不编造真题出处和年份；不确定就直说不确定。不写与备考无关的内容。';
var aiHistory = [], aiBusy = false;

function aiCfg(){

}

function openTeacher(prefill, context, sysExtra){

    '<div class="ai-log" id="aiLog"></div>' +

    '<input type="checkbox" id="aiCtx" checked> 带上当前页面内容当背景</label>' +
    '<div class="ai-row"><textarea class="inp" id="aiInput" placeholder="例如：这道资料分析题为什么比重上升？"></textarea>' +

    '<div class="modal-actions"><button class="btn ghost sm" data-act="ai-clear">清空对话</button>' +
    '<button class="btn ghost" data-act="modal-close">关闭</button></div>',
    function(box){
      aiLogSys('老师已就位。可以直接问题目、问方法，或让我点评你的答案。');
      if(prefill){ $('#aiInput', box).value = prefill; }

      $('#aiInput', box).focus();
    }

}
function aiLogSys(t){
  var log = $('#aiLog'); if(!log) return;
  var d = document.createElement('div');
  d.className = 'ai-msg sys'; d.textContent = t;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function aiBubble(role, text){
  var log = $('#aiLog'); if(!log) return null;
  var d = document.createElement('div');
  d.className = 'ai-msg ' + (role === 'user' ? 'me' : 'bot');
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function aiError(msg){
  var log = $('#aiLog'); if(!log) return;
  var d = document.createElement('div');
  d.className = 'ai-msg sys'; d.textContent = '⚠️ ' + msg;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function aiSend(){
  var box = $('#modalBox');
  var inp = $('#aiInput', box);
  var q = (inp.value || '').trim();
  if(!q || aiBusy) return;
  var cfg = aiCfg();
  if(!cfg.key){ aiError('还没填 API Key：⚙️ 设置 → AI 助教'); return; }
  inp.value = '';
  aiBubble('user', q);
  aiHistory.push({ role:'user', content:q });

  var ctx = '';
  if($('#aiCtx', box) && $('#aiCtx', box).checked){
    var v = $('#view');
    ctx = '\n\n【当前页面】' + currentPage + '\n' + (v ? v.innerText.slice(0, 900) : '');
  }
  aiBusy = true;
  var wait = aiBubble('bot', '老师正在想…');
  fetch(String(cfg.base).replace(/\/+$/, '') + '/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key },
    body: JSON.stringify({
      model: cfg.model,
      temperature: 0.3,
      max_tokens: 900,
      messages: [{ role:'system', content: AI_SYS + (aiSysExtra ? '\n\n' + aiSysExtra : '') + ctx }].concat(aiHistory.slice(-10))
    })
  })
  .then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP ' + r.status + ' ' + t.slice(0, 120)); });
    return r.json();
  })
  .then(function(j){
    var c = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '（没有拿到回复）';
    aiHistory.push({ role:'assistant', content:c });
    if(wait) wait.textContent = c;
    var log = $('#aiLog'); if(log) log.scrollTop = log.scrollHeight;
  })
  .catch(function(e){
    if(wait && wait.parentNode) wait.parentNode.removeChild(wait);
    aiError(String(e.message || e).slice(0, 160) + '（若是跨域/网络问题，换 DeepSeek 或硅基流动接口）');
  })
  .finally(function(){ aiBusy = false; });
}

          '<div class="stat"><div class="k">正确率</div><div class="v">' + (wk.count ? Math.round(wk.right / wk.count * 100) : 0) + '<small>%</small></div></div>' +
          '</div></div>';
  return html;

function weekStats(n){
  var o = { count:0, min:0, right:0 }, t = new Date();
  for(var i = 0; i < n; i++){
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
    var s = totalOf(dstr(d));
    o.count += s.count; o.min += s.min; o.right += s.right;
  }
  return o;
}

function renderStats(){
  var day = todayStr();

  html += '<div class="card"><div class="card-head"><h2>📅 今日汇总</h2><span class="tag">' + day + '</span></div>' +

    '<div class="stat"><div class="k">正确率</div><div class="v">' + (tot.count ? Math.round(tot.right / tot.count * 100) : 0) + '<small>%</small></div></div>' +
    '</div></div>';

  html += '<div class="card"><div class="card-head"><h2>✍️ 各模块记录</h2><span class="tag mint">自动保存</span></div>' +
    '<div class="tiny muted" style="margin-bottom:10px">在模块里做检验题会自动累加"做题数/正确数"；时长可手动补。</div>';
  PLAN_CATS.forEach(function(c){
    var s = getStat(day, c.name);
    html += '<div class="grid c3" style="gap:8px;margin-bottom:10px;align-items:end">' +
      '<div><div class="tiny" style="font-weight:700;margin-bottom:4px">' + c.icon + ' ' + esc(c.name) + '</div>' +
      '<div class="mini">正确率 ' + (s.count ? Math.round(s.right / s.count * 100) + '%' : '—') + '</div></div>' +
      '<div><div class="mini">做题数</div><input class="inp" type="number" min="0" inputmode="numeric" data-stat="' + esc(c.name) + '" data-field="count" value="' + (s.count || 0) + '"></div>' +
      '<div><div class="mini">时长(分钟)</div><input class="inp" type="number" min="0" inputmode="numeric" data-stat="' + esc(c.name) + '" data-field="min" value="' + (s.min || 0) + '"></div>' +
      '</div>';
  });
  html += '</div>';

  var days = [], maxC = 1;
  for(var i = 6; i >= 0; i--){
    var d = new Date(); d.setDate(d.getDate() - i);
    var s = totalOf(dstr(d));
    days.push({ label:(d.getMonth()+1) + '/' + d.getDate(), count:s.count });
    maxC = Math.max(maxC, s.count);
  }
  html += '<div class="card"><div class="card-head"><h2>📊 近 7 天做题量</h2><span class="tag">自动生成</span></div><div class="bars">';
  days.forEach(function(d){
    html += '<div class="col"><i style="height:' + Math.max(3, Math.round(d.count / maxC * 100)) + '%"></i><span>' + d.label + '</span></div>';
  });
  html += '</div></div>';

  html += '<div class="card"><div class="card-head"><h2>🎯 本周模块正确率</h2><span class="tag mint">找短板</span></div>';
  var rows = PLAN_CATS.map(function(c){
    var cnt = 0, right = 0;
    for(var i = 0; i < 7; i++){
      var d2 = new Date(); d2.setDate(d2.getDate() - i);
      var st = getStat(dstr(d2), c.name);
      cnt += st.count || 0; right += st.right || 0;
    }
    return { name:c.name, icon:c.icon, cnt:cnt, rate:cnt ? right / cnt : null };
  }).filter(function(r){ return r.cnt > 0; }).sort(function(a, b){ return (a.rate || 0) - (b.rate || 0); });

  if(!rows.length){
    html += '<div class="empty"><span class="big">🌾</span>本周还没有做题记录，先去各模块做题吧</div>';
  } else {
    rows.forEach(function(r){
      html += '<div style="margin-bottom:10px"><div class="tiny" style="display:flex;justify-content:space-between"><span>' + r.icon + ' ' + esc(r.name) + '　<span class="mini">' + r.cnt + ' 题</span></span><span class="pct">' + Math.round(r.rate * 100) + '%</span></div>' +
        '<div class="bar thin" style="margin-top:4px"><i style="width:' + Math.round(r.rate * 100) + '%"></i></div></div>';
    });
    html += '<div class="tiny muted">排序按正确率从低到高，最上面就是本周最该补的模块。</div>';
  }
  html += '</div>';
  return html;
}

function weekStart(){
  var d = new Date(); var w = d.getDay() || 7; d.setDate(d.getDate() - w + 1);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function weeklySummary(){
  var start = weekStart(), cats = {}, total = 0, recent = [];
  state.wrong.forEach(function(w){
    var d = parseDate(w.date);
    if(d >= start){
      cats[w.cat] = (cats[w.cat] || 0) + 1; total++; recent.push(w);
    }
  });
  var list = Object.keys(cats).map(function(k){ return { cat:k, n:cats[k] }; }).sort(function(a, b){ return b.n - a.n; });
  return { total:total, list:list, end:new Date(start.getTime() + 6 * 86400000) };
}
function adviceFor(cat){
  var m = {
    '政治理论':'每天固定 15 分钟读时政，把"考点"改写成一句话复述；错的多是表述记忆，用"关键词+整体逻辑"再记一遍。',
    '常识':'常识错题要按类别归堆（法律/科技/地理），一类一周只补一个方向，避免到处撒网。',
    '言语理解':'重点是"辨析点"而不是答案；把错过的近义成语整理成对照表，每天读 10 组。',
    '逻辑判断':'先翻译再判断：把题干条件写成 A→B 的式子，避免凭语感；加强削弱题回到"论点—论据"结构。',
    '数量关系':'错题按题型归类，记熟该题型的公式与特值法；考场上遇到同类直接套，不要重新推导。',
    '资料分析':'错的通常是"增长率/增长量"混用与"多几倍/是几倍"；建议每天限时算 2 篇，错题写出算式。',
    '申论小题':'多半是"要点不全"而非"写得不好"：重做时先标材料行数，确保一条要点对应一处材料。',
    '申论大作文':'分论点与论据脱节是主因；每写一个分论点，强制配一个具体案例或数据。'
  };
  return m[cat] || '把同类错题放在一起，找出重复出错的"同一个动作"，只改这一点就够。';
}

function weekBounds(offsetWeeks){
  var s = weekStart(); s.setDate(s.getDate() + (offsetWeeks || 0) * 7);
  return { start:s, end:new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6) };
}
function wrongIn(r){

function statRange(r){
  var c = 0, rt = 0, mn = 0;
  for(var d = new Date(r.start); d <= r.end; d.setDate(d.getDate() + 1)){
    var s = totalOf(dstr(d)); c += s.count; rt += s.right; mn += s.min;

}

function buildWeekReport(){
  var cur = weekBounds(0), prev = weekBounds(-1);
  var now = wrongIn(cur), old = wrongIn(prev);
  var cats = {};
  now.forEach(function(w){ cats[w.cat] = (cats[w.cat] || 0) + 1; });
  var list = Object.keys(cats).map(function(k){ return { cat:k, n:cats[k] }; }).sort(function(x, y){ return y.n - x.n; });
  var st = statRange(cur);
  var pending = state.wrong.filter(function(w){ return !w.mastered && daysSince(w.date) >= 3; })
                 .sort(function(x, y){ return x.date < y.date ? -1 : 1; }).slice(0, 5);
  var diff = now.length - old.length;
  var trend = now.length === 0 ? '' : (diff > 0 ? '（比上周多 ' + diff + ' 题）' : (diff < 0 ? '（比上周少 ' + (-diff) + ' 题）' : '（与上周持平）'));
  var nick = state.profile.nick || '备考兔';
  var lines = [];
  lines.push('📕 上岸工作台 · 错题周报');
  lines.push(nick + '　' + fmtMD(cur.start) + ' – ' + fmtMD(cur.end));
  lines.push('');
  lines.push(now.length ? ('本周新增 ' + now.length + ' 题' + trend) : '本周没有新增错题 🐰');
  if(list.length){
    lines.push('板块分布：' + list.map(function(x){ return x.cat + ' ' + x.n; }).join(' · '));
    lines.push('薄弱点：' + list[0].cat + '（' + list[0].n + ' 题）');
    lines.push('建议：' + adviceFor(list[0].cat));
  }
  lines.push('');
  lines.push('📊 本周学习：做题 ' + st.count + ' 道 · ' + st.min + ' 分钟 · 正确率 ' + (st.count ? Math.round(st.right / st.count * 100) + '%' : '—'));
  lines.push('📕 错题本累计 ' + state.wrong.length + ' 题，未攻克 ' + state.wrong.filter(function(w){ return !w.mastered; }).length + ' 题');
  if(pending.length){
    lines.push('');
    lines.push('🔁 到期待复做（≥3 天）：');
    pending.forEach(function(w, i){
      lines.push('  ' + (i + 1) + '. ' + w.title + '（' + w.cat + '，' + daysSince(w.date) + ' 天前）');
    });
  }
  lines.push('');
  lines.push('👉 回工作台继续：' + APP_URL);
  return { text:lines.join('\n'), newCount:now.length, subject:'【错题周报】' + fmtMD(cur.start) + '–' + fmtMD(cur.end) + ' 新增 ' + now.length + ' 题' };
}

/* ================= 动作分发 ================= */
function rerender(){
  var y = window.scrollY;
  route();
  window.scrollTo(0, y);
}
document.addEventListener('change', function(e){
  var t = e.target;
  if(t && t.hasAttribute && t.hasAttribute('data-stat')){
    var cat = t.getAttribute('data-stat'), field = t.getAttribute('data-field');
    var v = Math.max(0, parseInt(t.value, 10) || 0);
    var s = statOf(todayStr(), cat);
    s[field] = v;
    if(field === 'count' && v === 0) s.right = 0;
    save();
    toast('已保存：' + cat + ' ' + v);
  }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t && t.getAttribute && t.getAttribute('data-ai-field')){
    var af = t.getAttribute('data-ai-field');
    aiCfg()[af] = (t.value || '').trim();
    save();
    toast(af === 'key' ? (aiCfg().key ? 'API Key 已保存' : 'API Key 已清空') : '已保存');
    return;
  }
  if(t && t.getAttribute && t.getAttribute('data-gh-field')){
    var gf = t.getAttribute('data-gh-field');
    ghCfg()[gf] = (t.value || '').trim();
    save();
    toast(gf === 'token' ? (ghCfg().token ? 'token 已保存' : 'token 已清空') : '已保存');
    return;
  }
  if(t && t.getAttribute && t.getAttribute('data-report-field')){
    var f = t.getAttribute('data-report-field');
    state.settings.report[f] = (t.value || '').trim();
    save();
    if(f === 'webhook') toast(state.settings.report.webhook ? 'webhook 已保存' : 'webhook 已清空');
    else toast('邮箱已保存');
  }
});
$('#setBtn') && $('#setBtn').addEventListener('click', openSettings);

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var act = t.getAttribute('data-act');
  var id = t.getAttribute('data-id');

  if(act === 'toggle-plan' || act === 'del-plan'){
    if(act === 'toggle-plan') togglePlan(id); else delPlan(id);
    if(currentPage === 'plans' || PROGRESS_CATS[currentPage]) rerender(); else route();
    return;
  }
  if(act === 'toggle-plan-old'){
    var day = t.getAttribute('data-day');
    var arr = state.plans[day] || [];
    var it = arr.filter(function(x){ return x.id === id; })[0];
    if(it){ it.done = true; save(); rerender(); }
    return;
  }
  if(act === 'quick-add' || act === 'add-plan'){
    var presetCat = t.getAttribute('data-cat') || '';
    openModal(
      '<h3>➕ 添加打卡目标</h3><div class="desc">勾选"每日重复"后，明天会自动出现</div>' +
      '<div class="field"><label>目标内容</label><input class="inp" id="pText" maxlength="50" placeholder="例：资料分析 30 题"></div>' +
      '<div class="field"><label>分类</label><select class="inp" id="pCat">' +
      PLAN_CATS.map(function(c){ return '<option value="' + esc(c.name) + '"' + (c.name === presetCat ? ' selected' : '') + '>' + c.icon + ' ' + esc(c.name) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="field"><label><input type="checkbox" id="pRepeat" checked> 🔁 每日重复</label></div>' +
      '<div class="modal-actions"><button class="btn ghost" data-act="modal-close">取消</button>' +
      '<button class="btn primary" data-act="plan-save">保存</button></div>'
    );
    return;
  }
  if(act === 'plan-save'){
    var txt = ($('#pText') || {}).value || '';
    var cat = ($('#pCat') || {}).value || '言语理解';
    var rep = ($('#pRepeat') || {}).checked;
    if(!txt.trim()){ toast('请填写目标内容'); return; }
    addPlan(txt.trim(), cat, rep);
    closeModal(); rerender(); toast('已添加 🐰');
    return;
  }
  if(act === 'add-exam' || act === 'edit-exam'){
    var ex = id ? (state.exams || []).filter(function(x){ return x.id === id; })[0] : null;
    openModal(
      '<h3>' + (ex ? '✏️ 修改考试' : '➕ 添加考试') + '</h3>' +
      '<div class="field"><label>考试名称</label><input class="inp" id="eName" maxlength="30" value="' + esc(ex ? ex.name : '') + '" placeholder="例：2027年国考（笔试）"></div>' +
      '<div class="field"><label>考试日期</label><input class="inp" type="date" id="eDate" value="' + (ex ? ex.date : todayStr()) + '"></div>' +
      '<div class="field"><label>备注（可不填）</label><input class="inp" id="eNote" maxlength="40" value="' + esc(ex ? (ex.note || '') : '') + '" placeholder="例：预计时间，官网发布后修改"></div>' +
      '<div class="modal-actions"><button class="btn ghost" data-act="modal-close">取消</button>' +
      '<button class="btn primary" data-act="exam-save" data-id="' + (ex ? ex.id : '') + '">保存</button></div>'
    );
    return;
  }
  if(act === 'exam-save'){
    var nm = ($('#eName') || {}).value || '', dt = ($('#eDate') || {}).value || '', nt = ($('#eNote') || {}).value || '';
    if(!nm.trim() || !dt){ toast('名称和日期都要填'); return; }
    if(id){
      var e2 = (state.exams || []).filter(function(x){ return x.id === id; })[0];
      if(e2){ e2.name = nm.trim(); e2.date = dt; e2.note = nt.trim(); }
    } else {
      state.exams.push({ id:uid(), name:nm.trim(), date:dt, note:nt.trim() });
    }
    save(); closeModal(); rerender(); toast('已保存');
    return;
  }
  if(act === 'del-exam'){
    state.exams = state.exams.filter(function(x){ return x.id !== id; });
    save(); rerender(); toast('已删除');
    return;
  }
  if(act === 'news-batch'){
    state.archiveOffset = ((state.archiveOffset || 0) + 1) % Math.ceil(NEWS_ARCHIVE.length / 5);
    save(); rerender();
    return;
  }
  if(act === 'math-next'){
    state.mathOffset = ((state.mathOffset || 0) + 1) % MATH_TYPES.length;
    save(); rerender();
    return;
  }
  if(act === 'math-ans'){
    var box = $('#mathAns'); if(box) box.style.display = 'block';
    return;
  }
  if(act === 'acc'){
    t.parentElement.classList.toggle('open');
    return;
  }
  if(act === 'answer'){
    var qid = t.getAttribute('data-qid');
    if(state.quizLog[qid]) return;
    var rec = QUIZ_INDEX[qid];
    if(!rec) return;
    var chosen = parseInt(t.getAttribute('data-i'), 10);
    var cat = t.getAttribute('data-cat');
    var correct = chosen === rec.q.ans;
    state.quizLog[qid] = { ans:chosen, date:todayStr(), mod:rec.mod };
    logAnswer(cat, correct);
    save(); rerender();
    toast(correct ? '✅ 答对了' : '❌ 答错了，看下面解析');
    return;
  }
  if(act === 'quiz-to-wrong'){
    var qid2 = t.getAttribute('data-qid');
    var r2 = QUIZ_INDEX[qid2];
    var rec2 = state.quizLog[qid2];
    if(!r2 || !rec2) return;
    openWrongAdd(r2.cat, r2.q.stem.slice(0, 40));
    setTimeout(function(){
      var n = $('#wNote'); if(n) n.value = '正确答案：' + String.fromCharCode(65 + r2.q.ans) + '。' + r2.q.exp;
    }, 30);
    return;
  }
  if(act === 'wrong-add'){ openWrongAdd('', ''); return; }
  if(act === 'wrong-save'){
    var ti = ($('#wTitle') || {}).value || '';
    if(!ti.trim()){ toast('请填写题目标题'); return; }
    state.wrong.push({
      id:uid(), title:ti.trim(), cat:($('#wCat') || {}).value || '常识', date:todayStr(),
      note:(($('#wNote') || {}).value || '').trim(),
      transcript:(($('#wVoice') || {}).value || '').trim(),
      images:tmpImgs.slice(), mastered:false
    });
    save(); closeModal(); route(); toast('已存入错题本 📕');
    return;
  }
  if(act === 'voice'){ startVoice(t.getAttribute('data-target')); return; }
  if(act === 'wrong-master'){
    var w = state.wrong.filter(function(x){ return x.id === id; })[0];
    if(w){ w.mastered = !w.mastered; save(); rerender(); }
    return;
  }
  if(act === 'wrong-del'){
    state.wrong = state.wrong.filter(function(x){ return x.id !== id; });
    save(); rerender(); toast('已删除');
    return;
  }
  if(act === 'img-view'){
    var wid = t.getAttribute('data-id'), i = +t.getAttribute('data-i');
    var ww = state.wrong.filter(function(x){ return x.id === wid; })[0];
    if(ww && ww.images && ww.images[i]){
      openModal('<h3>🖼️ 错题图片</h3><img src="' + ww.images[i] + '" style="width:100%;border-radius:18px" alt="错题图片">' +
        '<div class="modal-actions"><button class="btn primary" data-act="modal-close">关闭</button></div>');
    }
    return;
  }
  if(act === 'wrong-export'){
    if(!state.wrong.length){ toast('还没有错题'); return; }
    openModal('<h3>📤 导出错题本</h3><div class="desc">当前共 ' + state.wrong.length + ' 题，选择导出格式</div>' +
      '<div style="display:grid;gap:9px">' +
      '<button class="btn primary" data-act="export-word">📘 导出为 Word（.doc）</button>' +
      '<button class="btn" data-act="export-pdf">📕 导出为 PDF（打印后另存）</button></div>' +
      '<div class="tiny muted" style="margin-top:10px">Word 会直接下载；PDF 会打开打印窗口，在"目标打印机"里选"存储为 PDF"即可。</div>' +
      '<div class="modal-actions"><button class="btn ghost" data-act="modal-close">取消</button></div>');
    return;
  }
  if(act === 'export-word'){
    var ok = downloadBlob(buildWrongDoc(), '错题本_' + todayStr() + '.doc', 'application/msword;charset=utf-8');
    closeModal();
    toast(ok ? '已开始下载 Word 文件 📘' : '下载失败，请重试');
    return;
  }
  if(act === 'export-pdf'){ closeModal(); openPrintWin(); return; }
  if(act === 'sl-next'){ state.slOffset = (state.slOffset || 0) + 1; save(); rerender(); return; }
  if(act === 'big-next'){ state.bigOffset = (state.bigOffset || 0) + 1; save(); rerender(); return; }
  if(act === 'sl-points'){ var sp = $('#slPoints'); if(sp) sp.style.display = sp.style.display === 'none' ? 'block' : 'none'; return; }
  if(act === 'set-font'){
    state.settings.font = t.getAttribute('data-v') || 'm';
    save(); applySettings();

/* ================= 语音识别 ================= */
function startVoice(targetId){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('这个浏览器不支持语音识别，请直接打字 ⌨️'); return; }
  try{
    var r = new SR();
    r.lang = 'zh-CN'; r.interimResults = false; r.continuous = false;
    r.onresult = function(ev){
      var txt = ev.results[0][0].transcript;
      var el = document.getElementById(targetId);
      if(el) el.value = (el.value ? el.value + ' ' : '') + txt;
      toast('已转成文字 ✍️');
    };
    r.onerror = function(){ toast('语音识别失败，可改为打字'); };
    r.start(); toast('🎤 正在听，请说话…');
  }catch(e){ toast('无法启动语音识别'); }
}

/* ================= 云同步（WebDAV，可选） ================= */
function syncCfg(){
  var url = ($('#syncUrl') || {}).value || '';
  var user = ($('#syncUser') || {}).value || '';
  var pass = ($('#syncPass') || {}).value || '';
  state.settings.sync = { url:url.trim(), user:user.trim(), pass:pass, lastSync:(state.settings.sync || {}).lastSync || '', connected:(state.settings.sync || {}).connected || false };
  save();
  return state.settings.sync;
}
function doSync(act){
  var s = syncCfg();
  if(!s.url){ toast('先填写 WebDAV 地址'); return; }
  var target = s.url.replace(/\/?$/, '/') + 'shangan-backup.json';
  var headers = { 'Authorization':'Basic ' + btoa(unescape(encodeURIComponent(s.user + ':' + s.pass))) };
  if(act === 'sync-test'){
    fetch(target, { method:'GET', headers:headers })
      .then(function(r){
        if(r.status === 404){ s.connected = true; toast('✅ 服务器可达（暂无备份文件）'); }
        else if(r.ok){ s.connected = true; toast('✅ 连接成功'); }
        else { s.connected = false; toast('服务器返回 ' + r.status); }
        save(); updateSyncPill();
      })
      .catch(function(){ s.connected = false; save(); updateSyncPill(); toast('连接失败：可能是跨域限制或地址有误'); });
    return;
  }
  if(act === 'sync-up'){
    saveNow();
    fetch(target, { method:'PUT', headers:Object.assign({ 'Content-Type':'application/json' }, headers), body:JSON.stringify(cloudPayload()) })
      .then(function(r){
        if(r.ok || r.status === 201 || r.status === 204){ s.connected = true; s.lastSync = new Date().toISOString(); state.settings.lastBackupTs = Date.now(); save(); updateSyncPill(); toast('☁️ 已上传备份'); }
        else toast('上传失败：' + r.status);
      })
      .catch(function(){ toast('上传失败：跨域或网络问题'); });
    return;
  }
  if(act === 'sync-down'){
    fetch(target, { headers:headers })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(obj){
        var prevSt = clone(state);
        state = keepLocalSecrets(deepMerge(clone(DEF_STATE), obj), prevSt);
        s = state.settings.sync; s.connected = true; s.lastSync = new Date().toISOString();
        saveNow(); applySettings(); renderProfile(); route(); closeModal(); toast('☁️ 已下载并覆盖本地数据');
      })
      .catch(function(){ toast('下载失败或文件不存在'); });
    return;
  }
}

/* ========== 自动云同步（改完 5 秒自动上传，不需手动点） ========== */
var syncTimer = null;
function syncHeaders(){
  var s = state.settings.sync || {};
  return { 'Authorization':'Basic ' + btoa(unescape(encodeURIComponent((s.user || '') + ':' + (s.pass || '')))) };
}
function syncTargetLed(){ var s = state.settings.sync || {}; return (s.url || '').replace(/\/?$/, '/') + 'shangan-backup.json'; }
function scheduleAutoSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ autoPush(); }, 5000);
}
function autoPush(cb){
  var s = state.settings.sync || {};
  if(!s.url){ if(cb) cb(false); return; }
  fetch(syncTargetLed(), { method:'PUT', headers:Object.assign({ 'Content-Type':'application/json' }, syncHeaders()), body:JSON.stringify(cloudPayload()) })
    .then(function(r){
      if(r.ok || r.status === 201 || r.status === 204){
        s.connected = true; s.lastSync = new Date().toISOString(); s.lastError = '';
        state.settings.lastBackupTs = Date.now();
        save(); updateSyncPill(); if(cb) cb(true);
      } else {
        s.connected = false; s.lastError = 'HTTP ' + r.status; save(); updateSyncPill(); if(cb) cb(false);
      }
    })
    .catch(function(){ s.connected = false; s.lastError = '跨域或网络异常'; save(); updateSyncPill(); if(cb) cb(false); });
}
/* 上传到云端的备份：剥掉本机凭证（密码/webhook 只留在本机） */
function cloudPayload(src){
  var c = clone(src || state);
  if(c.settings && c.settings.sync) c.settings.sync.pass = '';
  if(c.settings && c.settings.report) c.settings.report.webhook = '';
  if(c.settings && c.settings.gh) c.settings.gh.token = '';
  if(c.settings && c.settings.ai) c.settings.ai.key = '';
  return c;
}
/* 从云端/外部恢复时，保留本机已填的凭证，避免同步被自己清断 */
function keepLocalSecrets(next, prev){
  try{
    var pv = prev || {}, ps = (pv.settings || {}).sync || {}, pr = (pv.settings || {}).report || {};
    if(next.settings && next.settings.sync && !next.settings.sync.pass && ps.pass) next.settings.sync.pass = ps.pass;
    if(next.settings && next.settings.report && !next.settings.report.webhook && pr.webhook) next.settings.report.webhook = pr.webhook;
    var pg = (pv.settings || {}).gh || {};
    if(next.settings && next.settings.gh && !next.settings.gh.token && pg.token) next.settings.gh.token = pg.token;
    if(next.settings && next.settings.gh && !next.settings.gh.gistId && pg.gistId) next.settings.gh.gistId = pg.gistId;
    var pai = (pv.settings || {}).ai || {};
    if(next.settings && next.settings.ai && !next.settings.ai.key && pai.key) next.settings.ai.key = pai.key;
  }catch(e){}
  return next;
}
function checkRemoteNewer(){
  var s = state.settings.sync || {};
  if(!s.url) return;
  fetch(syncTargetLed(), { headers:syncHeaders() })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(obj){
      if(!obj) return;
      s.connected = true;
      if((obj.updatedAt || 0) - (state.updatedAt || 0) > 5 * 60000){
        showRestoreBar('云端备份', JSON.stringify(obj), obj.updatedAt);
      }
      save(); updateSyncPill();
    })
    .catch(function(){ s.connected = false; save(); updateSyncPill(); });
}

/* ========== 云同步：GitHub Gist（跨域可用，实测 api.github.com 允许 CORS） ========== */
var ghTimer = null, GH_FILE = 'shangan-backup.json';
function ghCfg(){ if(!state.settings.gh) state.settings.gh = { token:'', gistId:'', auto:false, lastSync:'' }; return state.settings.gh; }
function ghHeaders(extra){
  var h = { 'Authorization':'Bearer ' + ghCfg().token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
  return Object.assign(h, extra || {});
}
function ghJson(r){
  if(r.status === 401) throw new Error('token 无效或已过期');
  if(r.status === 403) throw new Error('token 权限不足（需要 gist 权限）');
  if(!r.ok) throw new Error('GitHub 返回 ' + r.status);
  return r.json();
}
function ghSchedulePush(){
  clearTimeout(ghTimer);
  ghTimer = setTimeout(function(){ ghPush(null, true); }, 5000);
}
/* 合并两份数据：集合取并集，标量设置取"更新"的一方；昵称/座右铭/头像按 profile.updatedAt 定胜负 */
function mergeStates(local, remote){
  if(!remote) return clone(local);
  if(!local) return clone(remote);
  var lN = local.updatedAt || 0, rN = remote.updatedAt || 0;
  var newer = lN >= rN ? local : remote;
  var older = lN >= rN ? remote : local;
  var out = clone(newer);

  // 昵称/座右铭/头像：谁改得更晚听谁的
  var lp = (local.profile || {}).updatedAt || 0, rp = (remote.profile || {}).updatedAt || 0;
  out.profile = clone(lp >= rp ? (local.profile || {}) : (remote.profile || {}));

  // 打卡：按日期、按 id 并集（done 为真优先）
  out.plans = {};
  var days = Object.keys(Object.assign({}, older.plans || {}, newer.plans || {}));
  days.forEach(function(d){
    var byId = {};
    ((older.plans || {})[d] || []).concat((newer.plans || {})[d] || []).forEach(function(it){
      if(!it || !it.id) return;
      var cur = byId[it.id];
      if(!cur || (!cur.done && it.done)) byId[it.id] = it;
    });
    out.plans[d] = Object.keys(byId).map(function(k){ return byId[k]; });
  });

  // 每日重复模板：按 内容+分类 去重
  var tpl = {}, seen = {};
  ((older.templates || []).concat(newer.templates || [])).forEach(function(t){
    var k = (t.text || '') + '|' + (t.cat || '');
    if(seen[k]) return;
    seen[k] = 1; tpl[t.id] = t;
  });
  out.templates = Object.keys(tpl).map(function(k){ return tpl[k]; });

  // 统计：按天按模块取各自最大值（避免互相抹掉）
  out.stats = {};
  var sdays = Object.keys(Object.assign({}, older.stats || {}, newer.stats || {}));
  sdays.forEach(function(d){
    var a = (older.stats || {})[d] || {}, b = (newer.stats || {})[d] || {}, m = {};
    Object.keys(Object.assign({}, a, b)).forEach(function(cat){
      var x = a[cat] || { count:0, min:0, right:0 }, y = b[cat] || { count:0, min:0, right:0 };
      m[cat] = { count:Math.max(x.count || 0, y.count || 0), min:Math.max(x.min || 0, y.min || 0), right:Math.max(x.right || 0, y.right || 0) };
    });
    out.stats[d] = m;
  });

  // 错题：按 id 并集
  var wr = {}, wseen = {};
  ((older.wrong || []).concat(newer.wrong || [])).forEach(function(w){
    if(!w || !w.id || wseen[w.id]) return;
    wseen[w.id] = 1; wr[w.id] = w;
  });
  out.wrong = Object.keys(wr).map(function(k){ return wr[k]; });

  // 做题记录：并集
  out.quizLog = Object.assign({}, older.quizLog || {}, newer.quizLog || {});
  out.skillsDone = Object.assign({}, older.skillsDone || {}, newer.skillsDone || {});

  // 轮换偏移：取较大值，避免内容跳来跳去
  out.archiveOffset = Math.max(older.archiveOffset || 0, newer.archiveOffset || 0);
  out.updatedAt = Math.max(lN, rN);
  return out;
}

/* 拉云端 → 合并 → 本地落地（不覆盖、不丢东西） */
function ghSyncNow(silent){
  var g = ghCfg();
  if(!g.token || !g.gistId){ if(!silent) toast('先填 token 并上传一次'); return; }
  fetch('https://api.github.com/gists/' + g.gistId, { headers: ghHeaders() })
    .then(ghJson)
    .then(function(j){
      var f = (j.files || {})[GH_FILE];
      if(!f || !f.content) return null;
      return JSON.parse(f.content);
    })
    .then(function(remote){
      if(!remote) return;
      var before = JSON.stringify(state);
      var merged = keepLocalSecrets(mergeStates(state, remote), clone(state));
      if(JSON.stringify(merged) !== before){
        state = merged;
        saveNow(); applySettings(); renderProfile(); route();
        if(!silent) toast('☁️ 已合并云端改动');
        else toast('☁️ 已同步到另一台设备的改动');
      } else if(!silent){
        toast('已是最新');
      }
    })
    .catch(function(e){ if(!silent) toast('读取失败：' + e.message); });
}
function ghPush(text, silent){
  var g = ghCfg();
  if(!g.token){ if(!silent) toast('先填 GitHub token'); return; }
  var put = function(remoteObj){
    // 先合并，再上传：这样另一台设备的改动不会被这台顶掉
    if(remoteObj){
      var merged = keepLocalSecrets(mergeStates(state, remoteObj), clone(state));
      if(JSON.stringify(merged) !== JSON.stringify(state)){
        state = merged;
        applySettings(); renderProfile();
      }
    }
    var body = { description:'上岸工作台 · 自动同步备份', files:{} };
    body.files[GH_FILE] = { content: JSON.stringify(cloudPayload(state)) };
    var url = g.gistId ? ('https://api.github.com/gists/' + g.gistId) : 'https://api.github.com/gists';
    if(!g.gistId){ body.public = false; }
    fetch(url, { method: g.gistId ? 'PATCH' : 'POST', headers: ghHeaders({ 'Content-Type':'application/json' }), body:JSON.stringify(body) })
      .then(ghJson)
      .then(function(j){
        g.gistId = j.id;
        g.lastSync = new Date().toISOString();
        g.auto = true;
        state.settings.lastBackupTs = Date.now();
        save(); updateSyncPill(); route();
        if(!silent) toast('☁️ 已同步（含合并另一台设备的改动）');
        else toast('☁️ 已自动同步');
      })
      .catch(function(e){ if(!silent) toast('同步失败：' + e.message); });
  };
  if(g.gistId){
    fetch('https://api.github.com/gists/' + g.gistId, { headers: ghHeaders() })
      .then(ghJson)
      .then(function(j){
        var f = (j.files || {})[GH_FILE], obj = null;
        try{ obj = f && f.content ? JSON.parse(f.content) : null; }catch(e){}
        put(obj);
      })
      .catch(function(){ put(null); });
  } else {
    put(null);
  }
}
/* 新设备没有 gistId 时：在自己账号的 gist 列表里找回备份 */
function ghEnsureGist(cb){
  var g = ghCfg();
  if(g.gistId){ cb(null, g.gistId); return; }
  fetch('https://api.github.com/gists?per_page=100', { headers: ghHeaders() })
    .then(ghJson)
    .then(function(list){
      var hit = (list || []).filter(function(x){ return x.files && x.files[GH_FILE]; })[0];
      if(!hit) throw new Error('云端还没有备份：先在有数据那台点「上传」');
      g.gistId = hit.id; save();
      cb(null, hit.id);
    })
    .catch(function(e){ cb(e); });
}
function ghPull(interactive){
  var g = ghCfg();
  if(!g.token){ if(interactive) toast('先填 GitHub token'); return; }
  ghEnsureGist(function(err){
    if(err){ if(interactive) toast('读取失败：' + err.message); return; }
    doGhPull(interactive);
  });
}
function doGhPull(interactive){
  var g = ghCfg();
  if(!g.token || !g.gistId){ if(interactive) toast('先填 token 并上传一次'); return; }
  // 交互式：走合并逻辑，不覆盖本机数据
  if(interactive){ ghSyncNow(false); return; }
  fetch('https://api.github.com/gists/' + g.gistId, { headers: ghHeaders() })
    .then(ghJson)
    .then(function(j){
      var f = (j.files || {})[GH_FILE];
      if(!f){ throw new Error('这个 Gist 里没有备份文件'); }
      var content = f.content;
      if(f.truncated && f.raw_url){
        return fetch(f.raw_url, { headers:{ 'Authorization':'Bearer ' + g.token } }).then(function(r){ return r.text(); });
      }
      return content;
    })
    .then(function(txt){
      var obj = JSON.parse(txt);
      if(interactive){
        if(!confirm('用云端数据覆盖这台设备的当前数据？（本地会先留快照）')) return;
        var prevSt = clone(state);
        state = keepLocalSecrets(deepMerge(clone(DEF_STATE), obj), prevSt);
        g = state.settings.gh; g.token = state.settings.gh.token || (prevSt.settings.gh || {}).token;
        saveNow(); applySettings(); renderProfile(); route(); closeModal();
        toast('☁️ 已从 Gist 恢复');
      } else if((obj.updatedAt || 0) - (state.updatedAt || 0) > 5 * 60000){
        showRestoreBar('GitHub Gist 备份', txt, obj.updatedAt);
      }
    })
    .catch(function(e){ if(interactive) toast('读取失败：' + e.message); });
}
function ghCheckNewer(){
  var g = ghCfg();
  if(!g.token || !g.gistId) return;
  ghPull(false);
}

/* 每日快照列表（设置里展示） */
function loadSnapList(){
  var box = $('#snapList');
  if(!box) return;
  idbGet('snapindex').then(function(list){
    list = (list || []).slice().sort().reverse();
    if(!list.length){ box.innerHTML = '<div class="tiny muted">还没有快照：每天首次保存时自动留一份，保留最近 10 天</div>'; return; }
    Promise.all(list.map(function(d){ return idbGet('snap:' + d).catch(function(){ return null; }); })).then(function(items){
      var ok = items.filter(Boolean);
      box.innerHTML = ok.length ? ok.map(function(it){
        return '<div class="row" style="margin-bottom:6px"><div class="txt"><b>' + esc(it.date) + '</b>' +
          '<div class="m">错题 ' + (it.wrong || 0) + ' 题 · 打卡 ' + (it.plans || 0) + ' 天 · ' + Math.round((it.size || 0) / 1024) + 'KB</div></div>' +
          '<button class="btn sm" data-act="snap-restore" data-key="' + esc(it.date) + '">恢复</button></div>';
      }).join('') : '<div class="tiny muted">快照读取失败</div>';
    });
  }).catch(function(){
    box.innerHTML = '<div class="tiny muted">这个浏览器禁用了本地备份库（如无痕模式），只能靠云同步或导出</div>';
  });
}

document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'skillFile'){ importSkillFiles(e.target.files); }
});
document.addEventListener('dragover', function(e){
  if(e.target && e.target.closest && e.target.closest('#impZone')){ e.preventDefault(); }
});
document.addEventListener('drop', function(e){
  var z = e.target && e.target.closest && e.target.closest('#impZone');
  if(!z) return;
  e.preventDefault();
  if(e.dataTransfer && e.dataTransfer.files) importSkillFiles(e.dataTransfer.files);
});
$('#aiFab').addEventListener('click', function(){ openTeacher(); });
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey && e.target && e.target.id === 'aiInput'){ e.preventDefault(); aiSend(); }
});

/* ================= 手势（收纳模式） ================= */
(function gestures(){
  var sx = 0, sy = 0, active = false, moved = false;
  document.addEventListener('touchstart', function(e){
    if(state.settings.pinned) return;
    if(e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; active = true; moved = false;
  }, { passive:true });
  document.addEventListener('touchmove', function(e){
    if(!active) return;
    var dx = Math.abs(e.touches[0].clientX - sx), dy = Math.abs(e.touches[0].clientY - sy);
    if(dx > 12 || dy > 12) moved = true;
  }, { passive:true });
  document.addEventListener('touchend', function(e){
    if(!active || state.settings.pinned) return;
    active = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dy) > 70) return;
    if(dx > 60 && sx < 40){ openNav(); return; }
    if(dx > 60 && document.body.classList.contains('nav-collapsed')){ openNav(); return; }
    if(dx < -60 && !document.body.classList.contains('nav-collapsed')){ closeNav(); return; }
  }, { passive:true });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closeModal(); }
  });
})();

/* ================= 路由 ================= */
var PAGES = {
  'countdown':renderCountdown, 'plans':renderPlans, 'politics':renderPolitics, 'common':renderCommon,
  'verbal':renderVerbal, 'logic':renderLogic, 'math':renderMath, 'data':renderData, 'stats':renderStats,
  'sl-small':renderSlSmall, 'sl-big':renderSlBig, 'wrong':renderWrong, 'skills':renderSkills
};
function route(){
  var key = (location.hash || '#countdown').replace('#','');
  if(!PAGES[key]) key = 'countdown';
  currentPage = key;
  var v = $('#view');
  try{
    v.innerHTML = PAGES[key]();
  }catch(err){
    v.innerHTML = '<div class="card"><div class="card-head"><h2>🙈 这个页面出了点小问题</h2></div>' +
      '<div class="tiny muted">' + esc(err && err.message ? err.message : '未知错误') + '</div>' +
      '<button class="btn primary" style="margin-top:12px" data-act="reload">重新加载</button></div>';
  }
  setActiveNav(key);
  if(key === 'skills') setTimeout(renderTeacherList, 30);
  var scrim = $('#scrim');
  if(scrim) scrim.remove();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* 自动拉取：切回页面、窗口获得焦点、每分钟一次（只在配置了 Gist 时） */
function autoSyncTick(){
  try{
    var g = state.settings.gh || {};
    if(g.token && g.gistId && !document.hidden) ghSyncNow(true);
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(!document.hidden) setTimeout(autoSyncTick, 800); });
window.addEventListener('focus', function(){ setTimeout(autoSyncTick, 800); });
setInterval(autoSyncTick, 60000);

/* ================= 启动 ================= */
function boot(){
  try{ ensureToday(); }catch(e){}
  try{ renderNav(); }catch(e){}
  try{ renderProfile(); }catch(e){}
  try{ applySettings(); }catch(e){}
  route();
  try{ maybeAutoWeeklyPush(); }catch(e){}
  setTimeout(afterBootChecks, 700);
}

/* 启动自检：localStorage 被清 → 自动从备份库恢复；备份库更新 → 提示恢复 */
var pendingRestore = null;
function afterBootChecks(){
  try{
    idbGet('state').then(function(rec){
      if(!rec || !rec.json) return;
      var cur = JSON.stringify(state);
      if(rec.json === cur) return;
      var isEmpty = !(state.wrong || []).length && !Object.keys(state.plans || {}).length && !(state.profile || {}).avatar;
      if(isEmpty){
        try{ state = deepMerge(clone(DEF_STATE), JSON.parse(rec.json)); }catch(e){ return; }
        saveNow(); renderProfile(); route();
        toast('🛟 浏览器数据被清过，已从本地备份库恢复');
        return;
      }
      if((rec.ts || 0) - (state.updatedAt || 0) > 30000) showRestoreBar('本地备份库', rec.json, rec.ts);
    }).catch(function(){});
  }catch(e){}
  try{
    var s = state.settings.sync || {};
    if(s.auto && s.url) checkRemoteNewer();
  }catch(e){}
  try{ ghSyncNow(true); }catch(e){}
}
function showRestoreBar(source, json, ts){
  pendingRestore = json;
  var oldBar = document.getElementById('restoreBar');
  if(oldBar) oldBar.remove();
  var bar = document.createElement('div');
  bar.id = 'restoreBar';
  bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:180;max-width:92vw;width:520px;background:#fffdf9;border:1px solid #f3dcc4;border-radius:20px;box-shadow:0 12px 30px rgba(150,120,90,.22);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap';
  bar.innerHTML = '<div style="flex:1;min-width:180px;font-size:calc(var(--fs-sm) + .5px);line-height:1.6">🛟 <b>' + esc(source) + '</b>里有比当前更新的数据（' +
    (ts ? new Date(ts).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—') + '）</div>' +
    '<button class="btn sm primary" data-act="restore-pending">恢复</button>' +
    '<button class="btn sm ghost" data-act="restore-dismiss">忽略</button>';
  document.body.appendChild(bar);
}
window.addEventListener('error', function(e){
  try{ toast('出现小问题：' + (e.message || '').slice(0, 30)); }catch(err){}
});
boot();
